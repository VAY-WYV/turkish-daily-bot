name: Turkish Daily Lesson
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  send-lesson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python send_lesson.py
